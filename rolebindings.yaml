---
# rolebinding `testadmin-rb` allows `testadmin` to see kafkaCluster
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: testadmin-rb-super
  namespace: confluent-nick
spec:
  principal:
    type: user
    name: testadmin
  role: SystemAdmin
---
# rolebinding `testadmin-rb-sr` allows `testadmin` to see schemaregistry information
# `schemaRegistryCllusterId` pattern: `id_<schemaregistry.name>_<namespace>`
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: testadmin-rb-sr
  namespace: confluent-nick
spec:
  principal:
    type: user
    name: testadmin
  clustersScopeByIds:
    schemaRegistryClusterId: id_schemaregistry_confluent-nick
  role: SystemAdmin
  ## if use other kafkaRestClass except for default, need to configure accordingly
  #kafkaRestClassRef:
  # name: default
---
# rolebinding `testadmin-rb-connect` allows `testadmin` to see connect cluster
# `connectClusterId` pattern: `<namespace>.<connect.name>`
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: testadmin-rb-connect
  namespace: confluent-nick
spec:
  principal:
    type: user
    name: testadmin
  clustersScopeByIds:
    connectClusterId: confluent-nick.connect
  role: SystemAdmin
  ## if use other kafkaRestClass except for default, need to configure accordingly
  #kafkaRestClassRef:
  # name: default
---
# rolebinding `testadmin-rb-ksql` allows `testadmin` to see ksqldb cluster
# `ksqlClusterId` pattern: `<namespace>.<ksqldb.name>`
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: testadmin-rb-ksql
  namespace: confluent-nick
spec:
  principal:
    type: user
    name: testadmin
  clustersScopeByIds:
    ksqlClusterId: confluent-nick.ksqldb_
  role: ResourceOwner
  resourcePatterns:
    - name: ksql-cluster
      patternType: LITERAL
      resourceType: KsqlCluster
  ## if use other kafkaRestClass except for default, need to configure accordingly
  #kafkaRestClassRef:
  # name: default
---
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: ksql-rb-cluster
  namespace: confluent-nick
spec:
  clustersScopeByIds:
    ksqlClusterId: confluent-nick.ksqldb_
  principal:
    type: user
    name: ksqldb
  role: ResourceOwner
  resourcePatterns:
  - name: ksql-cluster
    patternType: LITERAL
    resourceType: KsqlCluster
---
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: c3-ksql-rb-cluster
  namespace: confluent-nick
spec:
  clustersScopeByIds:
    ksqlClusterId: confluent-nick.ksqldb_
  principal:
    type: user
    name: c3
  role: ResourceOwner
  resourcePatterns:
    - name: ksql-cluster
      patternType: LITERAL
      resourceType: KsqlCluster
---
# rolebindings for ksql migrations example
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: ksql-rb-migrations
  namespace: confluent-nick
spec:
  principal:
    type: user
    name: ksql
  resourcePatterns:
    - name: confluent.ksqldb_ksql_MIGRATION
      patternType: PREFIXED
      resourceType: Topic
    - name: _confluent-ksql-confluent-nick.ksqldb_
      patternType: PREFIXED
      resourceType: Topic
    - name: test
      patternType: PREFIXED
      resourceType: Topic
  role: ResourceOwner
---
# rolebinding needed for connect
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: connect-rb-command
  namespace: confluent-nick
spec:
  principal:
    type: user
    name: connect
  resourcePatterns:
    - name: _confluent-command
      patternType: LITERAL
      resourceType: Topic
  role: ResourceOwner
