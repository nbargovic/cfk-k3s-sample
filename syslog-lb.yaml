apiVersion: v1
kind: Service
metadata:
  name: test-lb
  annotations:
    # Specify the load balancer type as Network Load Balancer (NLB)
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # Make the NLB internet-facing (external access)
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # Target pods by their IP address (recommended for NLB)
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    # Optional: If you want to use a specific Elastic IP for the NLB
    # service.beta.kubernetes.io/aws-load-balancer-eip-allocations: "eipalloc-xxxxxxxxxxxxxxxxx,eipalloc-yyyyyyyyyyyyyyyyy"
    # (Provide allocation IDs for each subnet where the NLB will be created)
    # Optional: Preserve client source IP
    service.beta.kubernetes.io/external-traffic-policy: "Local"
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: test-tcp
  selector:
    app: kafka-debug