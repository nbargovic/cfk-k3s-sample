apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent-nick
spec:
  replicas: 3
  image:
    application: confluentinc/cp-server:8.0.0
    init: confluentinc/confluent-init-container:3.0.0
  dataVolumeCapacity: 25Gi
  mountedSecrets:
    - secretRef: aws-secret
  configOverrides:
    server:
      - "log.retention.hours=72"
      - "log.roll.hours=71"
      - "log.segment.bytes=209715200"
      - "confluent.support.metrics.enable=false"
      - "confluent.tier.feature=false"
      - "confluent.tier.enable=false"
      - "confluent.tier.backend=S3"
      - "confluent.tier.s3.bucket=nbargovic-tiered-storage-eks"
      - "confluent.tier.s3.region=us-west-1"
      - "confluent.tier.s3.cred.file.path=/mnt/secrets/aws-secret/aws-creds.txt"
      - "confluent.metadata.enable.server.urls.refresh=false"
      - "kafka.rest.confluent.metadata.enable.server.urls.refresh=false"
  tls:
    secretRef: tls-kafka
  listeners:
    internal:
      authentication:
        type: mtls
        principalMappingRules:
          - RULE:.*CN[\s]?=[\s]?([a-zA-Z0-9.]*)?.*/$1/
      tls:
        enabled: true
    external:
      authentication:
        type: mtls
        principalMappingRules:
          - RULE:.*CN[\s]?=[\s]?([a-zA-Z0-9.]*)?.*/$1/
      tls:
        enabled: true
      externalAccess:
        type: loadBalancer
        loadBalancer:
          domain: ps.eks.nick
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
  authorization:
    type: rbac
    superUsers:
      - User:kafka
      - User:c3
  services:
    mds:
      tls:
        enabled: true
      tokenKeyPair:
        secretRef: mds-token
      provider:
        type: ldap
        ldap:
          address: ldap://ldap.ldap.svc.cluster.local:9389
          authentication:
            type: simple
            simple:
              secretRef: credential
          configurations:
            groupNameAttribute: cn
            groupObjectClass: posixGroup
            groupMemberAttribute: memberUid
            groupMemberAttributePattern: cn=(.*),ou=users,dc=test,dc=com
            groupSearchBase: dc=test,dc=com
            groupSearchScope: 2
            userNameAttribute: cn
            userMemberOfAttributePattern: cn=(.*),dc=test,dc=com
            userObjectClass: simpleSecurityObject
            userSearchBase: dc=test,dc=com
            userSearchScope: 2
  dependencies:
    kafkaRest:
      authentication:
        type: bearer
        bearer:
          secretRef: mds-client
    kRaftController:
      clusterRef:
        name: kraftcontroller
        namespace: confluent-nick
    metricsClient:
      url: https://controlcenter-next-gen.confluent-nick.svc.cluster.local:9090
      authentication:
        type: basic
        basic:
          secretRef: prometheus-client-creds
      tls:
        enabled: true
        secretRef: tls-prometheus-client
  podTemplate:
    probe:
      readiness:
        initialDelaySeconds: 360
      liveness:
        initialDelaySeconds: 360
    podSecurityContext:
      runAsUser: 0
    labels:
      pod-group: kafka
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: "kubernetes.io/hostname"
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: kafka
  license:
    globalLicense: true
---
apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent-nick
spec:
  clusterID: xyoHtUFpSq-esAxgyFAJbA
  replicas: 3
  image:
    application: confluentinc/cp-server:8.0.0
    init: confluentinc/confluent-init-container:3.0.0
  tls:
    secretRef: tls-kafka
  dataVolumeCapacity: 10G
  configOverrides:
    server:
      - inter.broker.protocol.version=3.6
  dependencies:
    metricsClient:
      url: https://controlcenter-next-gen.confluent-nick.svc.cluster.local:9090
      authentication:
        type: basic
        basic:
          secretRef: prometheus-client-creds
      tls:
        enabled: true
        secretRef: tls-prometheus-client
  podTemplate:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: "kubernetes.io/hostname"
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: kraftcontroller
---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestClass
metadata:
  name: default
  namespace: confluent-nick
spec:
  kafkaRest:
    authentication:
      type: bearer
      bearer:
        secretRef: rest-credential
