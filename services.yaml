apiVersion: platform.confluent.io/v1beta1
kind: KsqlDB
metadata:
  name: ksqldb
  namespace: confluent-nick
spec:
  replicas: 1
  image:
    application: confluentinc/cp-ksqldb-server:8.0.0
    init: confluentinc/confluent-init-container:3.0.0
  dataVolumeCapacity: 10Gi
  tls:
    secretRef: tls-ksqldb
  authorization:
    type: rbac
  configOverrides:
    server:
      - "confluent.metadata.enable.server.urls.refresh=false"
      - "ksql.confluent.metadata.enable.server.urls.refresh=false"
      - "confluent.support.metrics.enable=false"
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent-nick.svc.cluster.local:9071
      authentication:
        type: mtls
      tls:
        enabled: true
    mds:
      endpoint: https://kafka.confluent-nick.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token
      authentication:
        type: bearer
        bearer:
          secretRef: ksqldb-mds-client
      tls:
        enabled: true
  externalAccess:
    type: loadBalancer
    loadBalancer:
      domain: ps.eks.nick
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
  podTemplate:
    probe:
      readiness:
        initialDelaySeconds: 180
      liveness:
        initialDelaySeconds: 180
    podSecurityContext:
      runAsUser: 0
  license:
    globalLicense: true
---
apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent-nick
spec:
  replicas: 1
  image:
    application: confluentinc/cp-schema-registry:8.0.0
    init: confluentinc/confluent-init-container:3.0.0
  tls:
    secretRef: tls-schemaregistry
  authorization:
    type: rbac
  configOverrides:
    server:
      - "confluent.metadata.enable.server.urls.refresh=false"
      - "kafkastore.confluent.metadata.enable.server.urls.refresh=false"
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent-nick.svc.cluster.local:9071
      authentication:
        type: mtls
      tls:
        enabled: true
    mds:
      endpoint: https://kafka.confluent-nick.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token
      authentication:
        type: bearer
        bearer:
          secretRef: sr-mds-client
      tls:
        enabled: true
  externalAccess:
    type: loadBalancer
    loadBalancer:
      domain: ps.eks.nick
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
  podTemplate:
    podSecurityContext:
      runAsUser: 0
  license:
    globalLicense: true
---
apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent-nick
spec:
  replicas: 1
  build:
    type: onDemand
    onDemand:
      plugins:
        confluentHub:
          - name: kafka-connect-http
            owner: confluentinc
            version: "latest"
          - name: kafka-connect-s3-source
            owner: confluentinc
            version: "latest"
          - name: kafka-connect-s3
            owner: confluentinc
            version: "latest"
          - name: kafka-connect-syslog
            owner: confluentinc
            version: "latest"
  image:
    application: confluentinc/cp-server-connect:8.0.0
    init: confluentinc/confluent-init-container:3.0.0
  tls:
    secretRef: tls-connect
  authorization:
    type: rbac
  configOverrides:
    server:
      - "confluent.metadata.enable.server.urls.refresh=false"
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent-nick.svc.cluster.local:9071
      authentication:
        type: mtls
      tls:
        enabled: true
    mds:
      endpoint: https://kafka.confluent-nick.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token
      authentication:
        type: bearer
        bearer:
          secretRef: connect-mds-client
      tls:
        enabled: true
  externalAccess:
    type: loadBalancer
    loadBalancer:
      domain: ps.eks.nick
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
  podTemplate:
    probe:
      readiness:
        initialDelaySeconds: 360
      liveness:
        initialDelaySeconds: 360
    podSecurityContext:
      runAsUser: 0
  license:
    globalLicense: true
